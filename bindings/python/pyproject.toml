[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "kotatsu"
version = "0.2.1"
description = "Python bindings for the Kotatsu reader — reads Tansu's native S3 storage directly (no Kafka broker)."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "kotatsu"
# abi3 wheel — one wheel works on CPython >= 3.9.
features = ["pyo3/extension-module"]
strip = true
